		7852709E0FD2B4A600901629 /* Cleanup Simulator Clones */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Cleanup Simulator Clones";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "#!/bin/bash\n\necho \"🧹 Cleaning up simulator clones...\"\n\n# Get all iPhone 17 simulators\nIPHONE_17_SIMS=$(xcrun simctl list devices -j | jq -r '.devices[] | .[] | select(.name == \"iPhone 17\") | \"\\(.udid)|\\(.state)\"')\n\nKEEP_UUID=\"\"\nCOUNT=0\nDELETED=0\n\n# Keep first one, delete the rest\nwhile IFS='|' read -r UUID STATE; do\n    if [ -z \"$UUID\" ]; then\n        continue\n    fi\n\n    COUNT=$((COUNT + 1))\n\n    if [ $COUNT -eq 1 ]; then\n        KEEP_UUID=\"$UUID\"\n        echo \"✓ Keeping iPhone 17: $UUID\"\n    else\n        echo \"🗑️  Deleting clone: $UUID\"\n        if [ \"$STATE\" = \"Booted\" ]; then\n            xcrun simctl shutdown \"$UUID\" 2>/dev/null\n        fi\n        xcrun simctl delete \"$UUID\" 2>/dev/null && DELETED=$((DELETED + 1))\n    fi\ndone <<< \"$IPHONE_17_SIMS\"\n\nif [ $DELETED -gt 0 ]; then\n    echo \"✅ Deleted $DELETED simulator clone(s)\"\nelse\n    echo \"✓ No clones to delete\"\nfi\n\necho \"✓ Ready to test with iPhone 17: $KEEP_UUID\"\n";
			showEnvVarsInLog = 0;
		};
